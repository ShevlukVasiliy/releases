[project]
name = "releases-local"
version = "0.1.0"
description = "Local music library release manager"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47,<2",
    "yandex-music>=3.2,<4",
    "pillow>=10,<13",
    "keyring>=25,<26",
    "flask>=3.1,<4",
    "waitress>=3,<4",
    "filelock>=3.16,<4",
]

[project.scripts]
releases = "releases.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
releases = ["static/*"]
